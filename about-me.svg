<text font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#F3EEFB"><tspan x="44" y="72">I turn <tspan font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="23" font-weight="500" fill="#C9A6F5">raw business data</tspan> into</tspan><tspan x="44" y="106"><tspan fill="#F5C6D6">dashboards</tspan> that decision-makers</tspan><tspan x="44" y="140">actually use.</tspan></text>
<text font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#E6E0F5" fill-opacity=".86"><tspan x="44" y="188">I work as a <tspan font-weight="600" fill="#C9A6F5" fill-opacity="1">Data Analyst &amp; Business Intelligence Specialist</tspan>,</tspan><tspan x="44" y="208">building reporting across sales, finance, procurement, and production.</tspan></text>
<text font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#E6E0F5" fill-opacity=".86"><tspan x="44" y="244">My background in <tspan font-weight="600" fill="#C9A6F5" fill-opacity="1">Accounting</tspan> lets me understand the <tspan font-style="italic">business logic</tspan></tspan><tspan x="44" y="264">behind the numbers, not just the technical side. I'm motivated by</tspan><tspan x="44" y="284">using data to support better business and financial decisions.</tspan></text>
