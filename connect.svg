<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" role="img" aria-label="Let's connect: parnazali1383@gmail.com">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2040"/>
      <stop offset="100%" stop-color="#1a1327"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C6D6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C9A6F5" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C6D6"/>
      <stop offset="100%" stop-color="#C9A6F5"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="5" y="5" width="990" height="140" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="5" y="5" width="990" height="140" rx="16" fill="url(#grid)"/>

  <!-- envelope icon -->
  <g transform="translate(60 45)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="64" height="44" rx="7" stroke="#C9A6F5" stroke-width="3"/>
    <path d="M4 12 L32 34 L60 12" stroke="#F5C6D6" stroke-width="3"/>
    <circle cx="62" cy="6" r="6" fill="#F5C6D6" stroke="none">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text -->
  <text x="160" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Let's talk data.</text>
  <text x="160" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6d9f7">Open to conversations about analytics, research, and collaboration.</text>

  <!-- email button -->
  <g>
    <rect x="640" y="48" width="320" height="54" rx="27" fill="url(#btn)"/>
    <rect x="640" y="48" width="320" height="54" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="800" y="82" text-anchor="middle" font-family="Fira Code, Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#2a1a3d">parnazali1383@gmail.com</text>
  </g>
</svg>
