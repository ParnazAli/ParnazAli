<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Hi, I'm Parnaz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a4d"/>
      <stop offset="55%" stop-color="#5b3f7a"/>
      <stop offset="100%" stop-color="#8a63c7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C6D6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5C6D6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1028" flood-opacity="0.6"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <path d="M0 240 L80 230 L160 235 L240 215 L320 222 L400 200 L480 207 L560 188 L640 196 L720 172 L800 180 L880 158 L1000 150 L1000 260 L0 260 Z" fill="url(#area)"/>

    <g stroke-width="2" stroke-linecap="round">
      <g stroke="#F5C6D6" fill="#F5C6D6">
        <line x1="80" y1="215" x2="80" y2="250"/><rect x="74" y="223" width="12" height="16" rx="2"/>
        <line x1="240" y1="200" x2="240" y2="232"/><rect x="234" y="207" width="12" height="14" rx="2"/>
        <line x1="400" y1="185" x2="400" y2="215"/><rect x="394" y="191" width="12" height="16" rx="2"/>
        <line x1="560" y1="172" x2="560" y2="204"/><rect x="554" y="178" width="12" height="16" rx="2"/>
        <line x1="720" y1="156" x2="720" y2="188"/><rect x="714" y="162" width="12" height="16" rx="2"/>
        <line x1="880" y1="142" x2="880" y2="174"/><rect x="874" y="148" width="12" height="14" rx="2"/>
      </g>
      <g stroke="#C9A6F5" fill="none">
        <line x1="160" y1="218" x2="160" y2="250"/><rect x="154" y="224" width="12" height="16" rx="2"/>
        <line x1="320" y1="206" x2="320" y2="238"/><rect x="314" y="212" width="12" height="16" rx="2"/>
        <line x1="480" y1="190" x2="480" y2="222"/><rect x="474" y="196" width="12" height="16" rx="2"/>
        <line x1="640" y1="178" x2="640" y2="210"/><rect x="634" y="184" width="12" height="16" rx="2"/>
        <line x1="800" y1="164" x2="800" y2="196"/><rect x="794" y="170" width="12" height="16" rx="2"/>
      </g>
    </g>

    <path d="M0 240 L80 230 L160 235 L240 215 L320 222 L400 200 L480 207 L560 188 L640 196 L720 172 L800 180 L880 158 L1000 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.5s" fill="freeze"/>
    </path>
    <circle cx="995" cy="150" r="5" fill="#ffffff"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="2.5s" fill="freeze"/></circle>

    <!-- title -->
    <text x="470" y="82" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" filter="url(#shadow)">Hi, I'm Parnaz</text>

    <!-- custom bar-chart icon -->
    <g filter="url(#shadow)" transform="translate(720 44)">
      <rect x="0" y="22" width="12" height="18" rx="3" fill="#F5C6D6"/>
      <rect x="18" y="12" width="12" height="28" rx="3" fill="#C9A6F5"/>
      <rect x="36" y="0" width="12" height="40" rx="3" fill="#ffffff"/>
      <path d="M-2 14 L22 4 L34 -4" fill="none" stroke="#ffffff" stroke-opacity="0.0"/>
    </g>

    <text x="50%" y="120" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="16" fill="#F5C6D6" letter-spacing="2" filter="url(#shadow)">DATA ANALYST · BI SPECIALIST · FINANCIAL ANALYTICS</text>
  </g>
</svg>
