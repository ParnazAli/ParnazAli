    <rect width="1000" height="220" fill="url(#grid)"/>

    <path d="M0 180 L80 165 L160 172 L240 140 L320 150 L400 118 L480 128 L560 96 L640 108 L720 70 L800 82 L880 48 L1000 40 L1000 220 L0 220 Z" fill="url(#area)"/>

    <g stroke-width="2" stroke-linecap="round">
      <g stroke="#F5C6D6" fill="#F5C6D6">
        <line x1="80" y1="150" x2="80" y2="195"/><rect x="73" y="162" width="14" height="22" rx="2"/>
        <line x1="240" y1="122" x2="240" y2="165"/><rect x="233" y="134" width="14" height="20" rx="2"/>
        <line x1="400" y1="100" x2="400" y2="140"/><rect x="393" y="108" width="14" height="22" rx="2"/>
        <line x1="560" y1="78" x2="560" y2="118"/><rect x="553" y="86" width="14" height="22" rx="2"/>
        <line x1="720" y1="52" x2="720" y2="92"/><rect x="713" y="60" width="14" height="22" rx="2"/>
        <line x1="880" y1="30" x2="880" y2="68"/><rect x="873" y="38" width="14" height="20" rx="2"/>
      </g>
      <g stroke="#C9A6F5" fill="none">
        <line x1="160" y1="150" x2="160" y2="190"/><rect x="153" y="158" width="14" height="22" rx="2"/>
        <line x1="320" y1="130" x2="320" y2="170"/><rect x="313" y="138" width="14" height="22" rx="2"/>
        <line x1="480" y1="108" x2="480" y2="148"/><rect x="473" y="116" width="14" height="22" rx="2"/>
        <line x1="640" y1="88" x2="640" y2="128"/><rect x="633" y="96" width="14" height="22" rx="2"/>
        <line x1="800" y1="62" x2="800" y2="102"/><rect x="793" y="70" width="14" height="22" rx="2"/>
      </g>
    </g>

    <path d="M0 180 L80 165 L160 172 L240 140 L320 150 L400 118 L480 128 L560 96 L640 108 L720 70 L800 82 L880 48 L1000 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.5s" fill="freeze"/>
    </path>
    <circle cx="1000" cy="40" r="5" fill="#ffffff"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="2.5s" fill="freeze"/></circle>

    <text x="50%" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Hi, I'm Parnaz 📊</text>
    <text x="50%" y="144" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="16" fill="#F5C6D6" letter-spacing="2">DATA ANALYST · BI SPECIALIST · FINANCIAL ANALYTICS</text>
