<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Hi, I'm Parnaz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a4d"/>
      <stop offset="55%" stop-color="#5b3f7a"/>
      <stop offset="100%" stop-color="#8a63c7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C6D6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5C6D6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
