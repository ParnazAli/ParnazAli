name: Generate Activity Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Ashutosh00710/github-readme-activity-graph@v1
        with:
          username: ParnazAli
          theme: react-dark
          bg_color: 0D1117
          color: C9A6F5
          line: F5C6D6
          point: ffffff
          output: github-contribution-grid-snake.svg
